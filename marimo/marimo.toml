[diagnostics]
sql_linter = true

[formatting]
line_length = 79

[server]
follow_symlink = false
browser = "default"

[display]
default_table_page_size = 10
dataframes = "rich"
code_editor_font_size = 17
reference_highlighting = true
theme = "system"
cell_output = "below"
default_table_max_columns = 50
default_width = "medium"

[package_management]
manager = "pip"

[ai.openrouter]
api_key = "sk-or-v1-2a7912980744db57250d32d1ea84177236abb5df809ee40e364cdf9665b4b989sk-or-v1-2a7912980744db57250d32d1ea84177236abb5df809ee40e364cdf9665b4b989"
base_url = "https://openrouter.ai/api/v1/rerank"

[ai.custom_providers]

[ai.models]
displayed_models = []
chat_model = "google/gemini-3.1-flash-lite-preview"
edit_model = "google/gemini-3.1-flash-lite-preview"
custom_models = []

[ai.google]
api_key = ""

[save]
format_on_save = true
autosave = "after_delay"
autosave_delay = 1000

[mcp]
presets = []

[mcp.mcpServers]

[language_servers.pylsp]
enable_ruff = true
enable_flake8 = false
enable_mypy = true
enable_pydocstyle = false
enable_pylint = false
enabled = false
enable_pyflakes = false

[completion]
signature_hint_on_typing = false
activate_on_typing = true
copilot = false

[keymap]
preset = "default"

[keymap.overrides]

[snippets]
include_default_snippets = true
custom_paths = []

[runtime]
show_tracebacks = false
default_csv_encoding = "utf-8"
on_cell_change = "lazy"
auto_reload = "off"
auto_instantiate = false
std_stream_max_bytes = 1000000
watcher_on_save = "lazy"
output_max_bytes = 8000000
default_sql_output = "auto"
reactive_tests = true
