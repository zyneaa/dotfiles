set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"

set -g @plugin "Nybkox/tmux-kanagawa"
set -g @kanagawa-theme "wave"
set -g @kanagawa-ignore-window-colors true
set -g @kanagawa-plugins "cpu-usage ram-usage"

set -g @kanagawa-cpu-usage-label "CPU"
set -g @kanagawa-ram-usage-label "RAM"

set -g @kanagawa-show-powerline false

set -g allow-passthrough on

# opencode
set -g @opencode_status ""

#keymaps
unbind C-b
set-option -g prefix C-`
bind-key C-` send-prefix

# Moving to left/down/up/right panes re-zooms them immediately
bind-key -r h select-pane -L -Z
bind-key -r j select-pane -D -Z
bind-key -r k select-pane -U -Z
bind-key -r l select-pane -R -Z

# Press Prefix + q to show numbers, then press a number to jump and stay zoomed
bind-key a command-prompt -p "Switch to pane #:" "select-pane -t '%%' ; resize-pane -Z"

# opencode
bind-key o switch-client -T opencode_keys
bind-key -T opencode_keys c split-window -h -l 50% "opencode --port 8888"

set -g window-style "bg=default"
set -g window-active-style "bg=default"
set -g pane-border-style "fg=default,bg=default"
set -g pane-active-border-style "fg=magenta,bg=default"
set -g status-style "bg=default"

set -g allow-passthrough on

# Press Prefix + m + <pane#1..9>: jump to that pane (1 = first pane) and zoom immediately
bind-key m switch-client -T zoom_panes
bind-key -T zoom_panes 1 "select-pane -t :.0 ; resize-pane -Z ; switch-client -T root"
bind-key -T zoom_panes 2 "select-pane -t :.1 ; resize-pane -Z ; switch-client -T root"
bind-key -T zoom_panes 3 "select-pane -t :.2 ; resize-pane -Z ; switch-client -T root"
bind-key -T zoom_panes 4 "select-pane -t :.3 ; resize-pane -Z ; switch-client -T root"
bind-key -T zoom_panes 5 "select-pane -t :.4 ; resize-pane -Z ; switch-client -T root"
bind-key -T zoom_panes 6 "select-pane -t :.5 ; resize-pane -Z ; switch-client -T root"
bind-key -T zoom_panes 7 "select-pane -t :.6 ; resize-pane -Z ; switch-client -T root"
bind-key -T zoom_panes 8 "select-pane -t :.7 ; resize-pane -Z ; switch-client -T root"
bind-key -T zoom_panes 9 "select-pane -t :.8 ; resize-pane -Z ; switch-client -T root"
bind-key -T zoom_panes Escape switch-client -T root

run-shell "$HOME/dotfiles/tmux/plugins/tpm/tpm"

# Number windows starting at 1 so Leader + <number> selects window 1, 2, ...
# (set AFTER tpm since tmux-sensible resets it during plugin load)
set -g base-index 1

# strip the session name from the left of the status line (set by the theme)
set -g status-left ''

# When zoomed: show the pane-overview (1-based index : process) in the bar.
# When not zoomed: nothing extra on the right (CPU/RAM removed).
#  (must be set AFTER tpm run-shell so the theme doesn't overwrite it;
#   use plain set -g, NOT -F: the conditional must stay literal so it
#   re-evaluates window_zoomed_flag on every status refresh)
set -g status-right '#[fg=#363646,bg=#ff9e3b]#{?window_zoomed_flag, #(/Users/htetmyetlynn/dotfiles/tmux/scripts/pane_overview.sh),}'
set -g status-right-length 150
